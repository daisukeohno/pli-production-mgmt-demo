id: PM03-03
title: 歩留まり率による切り上げ計算の確認（端数あり）
screen: PM03
status: pending
source: docs/design.md §4 PM03-3 / §2 ルール6
description: >
  10000014 を 1 台指示。20000035 は 1×2÷0.95=2.105… → 切り上げ 3。在庫 60 を 3 に絞って不足させずに
  必要数のみ確認するため、STOCK を事前に 2 にしておき M015 の一覧で needQty=3 を確認する。
preconditions:
  - "UPDATE SANSEKI.STOCK SET STOCK_QTY = 2 WHERE ITEM_CD = '20000035'（前処理ステップ未実装のため PM03 実装時にランナーへ追加）"
steps:
  - name: 初回起動
    request: { method: GET, path: /api/pm03 }
    expect: { status: 200 }
  - name: 登録 → M015
    request:
      path: /api/pm03
      body: { aid: ENTER, itemCd: '10000014', orderQty: '1', dueDate: '2026-12-01' }
    expect:
      status: 422
      body:
        - { path: $.msgId, equals: M015 }
  - name: PF4 で必要数 3（切り上げ）
    request:
      path: /api/pm03
      body: { aid: PF4 }
    expect:
      status: 200
      body:
        - { path: '$.ngList[0].itemCd', equals: '20000035' }
        - { path: '$.ngList[0].needQty', equals: 3 }
