steps:
  # R1 チェックデジット計算（モジュラス10・ウェイト3-1）
  #   先頭7桁 2 0 0 0 0 1 2 × ウェイト 3 1 3 1 3 1 3
  #   = 2×3 + 0×1 + 0×3 + 0×1 + 0×3 + 1×1 + 2×3 = 6 + 0 + 0 + 0 + 0 + 1 + 6 = 13
  #   13 MOD 10 = 3 → (10 − 3) MOD 10 = 7 → 正しい 8 桁目は 7 → 20000127 は正常
  - name: 機能2（登録）で 20000127 カップリングを登録
    action:
      key: ENTER
      input: {F-FUNC: '2', F-ITEMCD: '20000127', F-ITEMNM: カップリング, F-KBN: '2', F-UNIT: 個}
    expect:
      header: {title: PM01 品目マスタ保守, date: 2026/10/07}
      msg: {id: M005, text: 登録しました。}
  - name: 登録した品目を照会できる
    action:
      key: ENTER
      input: {F-FUNC: '1', F-ITEMCD: '20000127'}
    expect:
      fields: {F-ITEMCD: '20000127', F-ITEMNM: カップリング, F-KBN: '2', F-UNIT: 個}
      msg: null
