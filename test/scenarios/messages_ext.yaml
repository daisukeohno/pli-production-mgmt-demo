# PMMSG.inc（M001〜M017）に無いメッセージの追加定義。
# 判断 d-catalog-defaults で「D-06 連番 9999 超過はエラー、新メッセージを 1 件追加」と決定済み。
# カタログ §8 D-06 の暫定案は「範囲外としてエラー（メッセージ未定義のため要決定）」で ID・文言の指定がないため、
# PMMSG の採番規則（M + 3 桁連番）と文体に合わせて本ファイルで暫定定義する（ID・文言は要承認）。
messages:
  - id: M018
    text: 製造指示番号の連番が上限(9999)に達しました。
    screens: [PM03]
    decision: D-06
    condition: 採番後の SEQ_NO が 9999 を超える（同一年内の 10000 件目）。WORK_ORDER・SEQ_CTL とも更新しない（ロールバック）
    status: 暫定（ID・文言は承認待ち）
