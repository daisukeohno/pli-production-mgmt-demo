spring:
  application:
    name: production-mgmt-backend
  datasource:
    # 開発・テストは H2（PostgreSQL 互換モード）。本番想定は PostgreSQL（application-postgres.yml）
    url: jdbc:h2:mem:sanseki;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  flyway:
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null
  mvc:
    problemdetails:
      enabled: false

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

sanseki:
  # GET-SYS-DATE（CICS ASKTIME）はホストのローカル時刻。新システムは Asia/Tokyo で取得する（カタログ C-4）
  zone-id: Asia/Tokyo
