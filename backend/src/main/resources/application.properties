spring.application.name=pm-backend
server.port=8080

# DB2 相当（開発用 H2 / DB2 互換モード）
spring.datasource.url=jdbc:h2:mem:pmdb;MODE=DB2;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=never

# 疑似会話（COMMAREA）はセッション＝端末単位で保持
server.servlet.session.timeout=30m

# GET_SYS_DATE / CURRENT TIMESTAMP 相当のタイムゾーン（JST 固定）
pm.system.zone=Asia/Tokyo
